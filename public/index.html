<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EscalaMed</title>
  <meta name="description" content="EscalaMed: gestão de escalas e plantões para equipes de saúde." />
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    .boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--esp-4);
    }
    .boot .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--esp-3);
      padding: var(--esp-6);
      max-width: 420px;
      text-align: center;
    }
    .boot img { width: 64px; height: 64px; }
  </style>
</head>
<body>
  <main class="boot">
    <div class="card">
      <img src="/img/logo.svg" alt="" />
      <h1>EscalaMed</h1>
      <p class="muted">Gestão de escalas e plantões para equipes de saúde.</p>
      <span class="badge badge-primary" id="status">Conectando ao Firebase…</span>
    </div>
  </main>

  <script type="module">
    import { app } from '/js/firebase.js';
    import { useEmulators } from '/js/config.js';

    const status = document.getElementById('status');
    status.textContent = `Firebase conectado: ${app.options.projectId}${useEmulators ? ' (emulador)' : ''}`;
  </script>
</body>
</html>
