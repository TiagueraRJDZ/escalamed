<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações | EscalaMed</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <link rel="preload" href="/fonts/PitangaVariable.woff2" as="font" type="font/woff2" crossorigin />
  <!-- SDK do Firebase baixado já no início, em paralelo (sem esperar os imports em cascata) -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/group.css" />
  <link rel="stylesheet" href="/css/settings.css" />
</head>
<body class="is-booting">
  <div class="boot-spinner"><div class="spinner" role="status" aria-label="Carregando"></div></div>

  <main id="page" class="page settings-page" data-active="settings">
    <!-- Vai para a faixa branca do topo (no lugar da busca) -->
    <h1 class="topbar-title" id="settings-title" data-topbar-title>Configurações</h1>

    <!-- Painel da seção. As seções vêm pelos subitens de "Configurações" no menu lateral
         e são montadas por js/settings/*.js -->
    <div class="settings-layout" id="settings-layout">
      <section class="settings-panel" aria-labelledby="settings-section-title">
        <header class="settings-panel-header">
          <h2 id="settings-section-title"></h2>
        </header>
        <div class="settings-panel-body" id="settings-sections"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/pages/settings.js"></script>
</body>
</html>
