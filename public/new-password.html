    // Menu lateral e barra do topo ficam parados na transição, se já estiverem na tela
    // (são montados pelo JS; se ainda não existirem, fica só o esmaecer padrão).
    // Nomes únicos por página. Transição interrompida (ex.: redirecionamento) não é erro.
    (() => {
      const nomear = (event) => {
        const t = event.viewTransition;
        if (!t) return;
        [t.ready, t.finished, t.updateCallbackDone].forEach((p) => p && p.catch(() => {}));
        [['.sidebar', 'menu-lateral'], ['.topbar', 'barra-topo']].forEach(([seletor, nome]) => {
          const el = document.querySelector(seletor);
          if (el) el.style.viewTransitionName = nome;
        });
      };
      addEventListener('pageswap', nomear);
      addEventListener('pagereveal', nomear);
    })();
  </script>

<body>
  <main class="auth-panel solo-page">
    <div class="auth-box">
      <div class="auth-brand" style="display:flex">
        <div class="brand brand--light" role="img" aria-label="EscalaMed">
          <svg class="brand-icon" width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="7" y="7" width="12" height="12" rx="3.5" fill="#FFFFFF"/>
            <rect x="21" y="7" width="12" height="12" rx="3.5" fill="#FFFFFF" fill-opacity=".35"/>
            <rect x="7" y="21" width="12" height="12" rx="3.5" fill="#FFFFFF" fill-opacity=".35"/>
            <rect x="21" y="21" width="12" height="12" rx="3.5" fill="#2FD3B5"/>
            <path d="M27 24.5v5M24.5 27h5" stroke="#0B4F45" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="brand-text">
            <span class="brand-name"><span class="brand-escala">Escala</span><span class="brand-med">Med</span></span>
            <span class="brand-tagline">PLANTÕES · EQUIPES</span>
          </div>
        </div>
      </div>
      <section class="auth-view" aria-labelledby="new-password-title">
        <header class="auth-header">
          <h1 id="new-password-title">Crie uma senha nova</h1>
          <p class="muted">Você entrou com uma senha provisória. Crie a sua senha para continuar.</p>
        </header>
        <form id="form-new-password" novalidate>
          <div class="alert form-alert" role="alert" hidden></div>
          <input type="text" name="username" id="np-username" autocomplete="username" hidden />
          <div class="field">
            <label class="label" for="np-current">Senha provisória</label>
            <div class="input-icon password-wrap">
              <span data-icon="lock"></span>
              <input class="input" id="np-current" name="current" type="password" autocomplete="current-password" required />
            </div>
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label class="label" for="np-password">Nova senha</label>
            <div class="input-icon password-wrap">
              <span data-icon="lock"></span>
              <input class="input" id="np-password" name="password" type="password" autocomplete="new-password" aria-describedby="np-rules" required />
            </div>
            <div class="strength-meter" id="np-meter" aria-live="polite"><i></i><i></i><i></i><i></i><span></span></div>
            <ul class="password-rules" id="np-rules" aria-label="Requisitos da senha"></ul>
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label class="label" for="np-confirm">Confirmar nova senha</label>
            <div class="input-icon password-wrap">
              <span data-icon="lock"></span>
              <input class="input" id="np-confirm" name="confirm" type="password" autocomplete="new-password" required />
            </div>
            <span class="field-error"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Salvar senha e continuar</button>
        </form>
        <p class="auth-switch"><button type="button" class="link-button" id="np-logout">Sair</button></p>
      </section>
    </div>
    <footer class="app-credits" data-credits></footer>
  </main>
