  <style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
  <script>
    // Menu lateral e barra do topo ficam parados na transição, se já estiverem na tela
    // (são montados pelo JS; se ainda não existirem, fica só o esmaecer padrão).
    // Nomes únicos por página. Transição interrompida (ex.: redirecionamento) não é erro.
    (() => {
      const nomear = (event) => {
        const t = event.viewTransition;
        if (!t) return;
        [t.ready, t.finished, t.updateCallbackDone].forEach((p) => p && p.catch(() => {}));
        [['.sidebar', 'menu-lateral'], ['.topbar', 'barra-topo']].forEach(([seletor, nome]) => {
          const el = document.querySelector(seletor);
          if (el) el.style.viewTransitionName = nome;
        });
      };
      addEventListener('pageswap', nomear);
      addEventListener('pagereveal', nomear);
    })();
  </script>

<body class="is-booting">
  <div class="boot-spinner"><div class="spinner" role="status" aria-label="Carregando"></div></div>

  <main id="page" class="page group-page" data-active="schedules">
    <a class="btn btn-ghost group-back" href="/schedules.html"><span data-icon="arrowLeft"></span>Voltar para escalas</a>

    <section class="card group-header-card" aria-labelledby="group-name">
      <span class="group-avatar" id="group-avatar" aria-hidden="true"></span>
      <div class="group-title">
        <h1 id="group-name">Carregando…</h1>
        <p class="muted" id="group-unit"></p>
      </div>
      <div class="group-header-actions" id="group-actions"></div>
    </section>

    <div class="tabs" role="tablist" aria-label="Seções do grupo" id="group-tabs">
      <button type="button" class="tab" role="tab" id="tab-calendar" aria-controls="panel-calendar" aria-selected="true">
        <span data-icon="calendar"></span>Calendário
      </button>
      <button type="button" class="tab" role="tab" id="tab-schedule" aria-controls="panel-schedule" aria-selected="false" tabindex="-1" hidden>
        <span data-icon="edit"></span>Editar escala
      </button>
      <button type="button" class="tab" role="tab" id="tab-members" aria-controls="panel-members" aria-selected="false" tabindex="-1" hidden>
        <span data-icon="users"></span>Membros <span class="tab-count" id="members-count"></span>
      </button>
    </div>

    <!-- Calendário: dias com plantão do usuário e plantões do dia -->
    <section class="tab-panel group-calendar-panel" role="tabpanel" id="panel-calendar" aria-labelledby="tab-calendar">
      <div class="card calendar-card" id="group-calendar" aria-label="Calendário do grupo"></div>
      <div class="card my-shifts-card">
        <h2 class="my-shifts-title" id="my-shifts-title">Meus plantões</h2>
        <p class="muted text-sm" id="my-shifts-note"></p>
        <ul class="my-shifts" id="my-shifts" aria-live="polite"></ul>
      </div>
    </section>

    <!-- Editar escala: meses do ano com a situação de cada um -->
    <section class="card tab-panel" role="tabpanel" id="panel-schedule" aria-labelledby="tab-schedule" hidden>
      <div class="months-head">
        <h2>Gerenciamento de escalas</h2>
        <div class="year-nav">
          <button type="button" class="btn-icon" id="year-prev" aria-label="Ano anterior"><span data-icon="chevronLeft"></span></button>
          <strong id="year-label" aria-live="polite"></strong>
          <button type="button" class="btn-icon" id="year-next" aria-label="Próximo ano"><span data-icon="chevronRight"></span></button>
        </div>
      </div>
      <ul class="month-list" id="month-list"></ul>
    </section>

    <!-- Membros -->
    <section class="card tab-panel" role="tabpanel" id="panel-members" aria-labelledby="tab-members" hidden>
      <div class="members-toolbar">
        <div class="input-icon">
          <span data-icon="search"></span>
          <label class="sr-only" for="member-search">Procurar membro</label>
          <input class="input" id="member-search" type="search" placeholder="Procurar por nome ou e-mail" autocomplete="off" />
        </div>
        <button type="button" class="btn btn-primary" id="invite-button" hidden><span data-icon="userPlus"></span>Convidar</button>
      </div>

      <div id="invites-section" hidden>
        <h2 class="section-title">Convites pendentes</h2>
        <ul class="invite-list" id="invite-list"></ul>
      </div>

      <div id="member-sections" aria-live="polite"></div>
    </section>
  </main>

  <!-- Modal: convidar -->
  <dialog class="modal" id="modal-invite" aria-labelledby="modal-invite-title">
    <form id="invite-form" novalidate>
      <div class="dialog-header">
        <h2 id="modal-invite-title">Convidar para o grupo</h2>
        <button type="button" class="btn-icon" data-close aria-label="Fechar"><span data-icon="x"></span></button>
      </div>
      <div class="dialog-body">
        <div class="alert form-alert" role="alert" hidden></div>
        <div class="field">
          <label class="label" for="invite-email">Pessoa ou e-mail</label>
          <div class="invite-picker">
            <input class="input" id="invite-email" name="email" type="text" autocomplete="off" spellcheck="false"
              role="combobox" aria-autocomplete="list" aria-controls="invite-results" aria-expanded="false" />
            <ul class="search-results" id="invite-results" role="listbox" aria-label="Pessoas encontradas" hidden></ul>
          </div>
          <div class="invite-chosen" id="invite-chosen" hidden></div>
          <span class="field-error"></span>
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary">Criar convite</button>
      </div>
    </form>
  </dialog>

  <!-- Modal: convite criado (link para compartilhar) -->
  <dialog class="modal" id="modal-invite-link" aria-labelledby="modal-invite-link-title">
    <div class="dialog-header">
      <h2 id="modal-invite-link-title">Convite criado</h2>
      <button type="button" class="btn-icon" data-close aria-label="Fechar"><span data-icon="x"></span></button>
    </div>
    <div class="dialog-body">
      <p class="muted" id="invite-link-text"></p>
      <div class="copy-field">
        <input class="input" id="invite-link" type="text" readonly aria-label="Link do convite" />
        <button type="button" class="btn btn-secondary" id="copy-link">Copiar</button>
      </div>
    </div>
    <div class="dialog-footer">
      <a class="btn btn-secondary" id="share-whatsapp" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
      <button type="button" class="btn btn-primary" data-close>Pronto</button>
    </div>
  </dialog>

  <!-- Modal: gerenciar membro (coordenação e remoção) -->
  <dialog class="modal" id="modal-role" aria-labelledby="modal-role-title">
    <div class="dialog-header">
      <h2 id="modal-role-title">Gerenciar membro</h2>
      <button type="button" class="btn-icon" data-close aria-label="Fechar"><span data-icon="x"></span></button>
    </div>
    <div class="dialog-body">
      <div class="role-target" id="role-target"></div>
      <div class="role-options" id="role-options" role="group" aria-label="Ações"></div>
    </div>
  </dialog>

  <!-- Gaveta: plantões do dia -->
  <dialog class="drawer" id="drawer-day" aria-labelledby="drawer-day-title">
    <div class="dialog-header">
      <h2 id="drawer-day-title">Plantões do dia</h2>
      <button type="button" class="btn-icon" data-close aria-label="Fechar"><span data-icon="x"></span></button>
    </div>
    <div class="dialog-body">
      <div class="week-strip">
        <button type="button" class="btn-icon" data-week-nav="-7" aria-label="Semana anterior"><span data-icon="chevronLeft"></span></button>
        <div class="week-days" id="week-days" role="group" aria-label="Dias"></div>
        <button type="button" class="btn-icon" data-week-nav="7" aria-label="Próxima semana"><span data-icon="chevronRight"></span></button>
      </div>
      <p class="day-title" id="day-label" aria-live="polite"></p>
      <div class="segmented" id="day-mode" role="group" aria-label="Escala" hidden>
        <button type="button" data-mode="dynamic" aria-pressed="true">Dinâmica</button>
        <button type="button" data-mode="fixed" aria-pressed="false">Fixa</button>
      </div>
      <div id="day-shifts"></div>
    </div>
  </dialog>

  <!-- Gaveta: detalhes de um plantão (ao clicar em alguém nos plantões do dia) -->
  <dialog class="drawer" id="drawer-shift" aria-labelledby="drawer-shift-title">
    <div class="dialog-header">
      <button type="button" class="btn-icon" data-close aria-label="Voltar para os plantões do dia"><span data-icon="arrowLeft"></span></button>
      <h2 id="drawer-shift-title">Detalhes do plantão</h2>
      <button type="button" class="btn-icon" id="close-shift-drawers" aria-label="Fechar"><span data-icon="x"></span></button>
    </div>
    <div class="dialog-body" id="shift-detail"></div>
  </dialog>

  <script type="module" src="/js/pages/group.js?v=b4ab6fa076"></script>
</body>
